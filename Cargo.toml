[package]
name = "conduit"
version = "1.0.0"
edition = "2021"
description = "CONDUIT - a two-player terminal game where the beam is your only weapon"
license = "MIT"

[lib]
name = "conduit"
path = "src/lib.rs"

[[bin]]
name = "conduit"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
